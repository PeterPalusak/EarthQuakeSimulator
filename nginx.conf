server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 1. SPA fallback — one entry point, and the PWA needs any path to return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Rapier's WebAssembly binary MUST be application/wasm or it never instantiates.
    #    `types { }` + default_type is the safe idiom: a bare `types { application/wasm wasm; }`
    #    collides with the image's own mime.types and nginx refuses to start.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Cache policy. Vite hashes asset filenames, so those are immutable forever...
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ...but these three are NOT hashed, and caching them strands users on an old build. An
    # immutable sw.js means a deployed fix never reaches a returning user, and the symptom —
    # "my change didn't deploy" — sends you looking at a pipeline that is working perfectly.
    location = /index.html           { add_header Cache-Control "no-cache"; }
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /registerSW.js        { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # 4. Compression — Three.js plus Rapier is ~1 MB gzipped, 3 MB raw.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm
               text/css text/plain image/svg+xml application/manifest+json;

    location = /healthz { access_log off; return 200 "ok\n"; }
}
