name: Deploy

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Least privilege by default; the two jobs widen it only as far as they each need.
permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deployment that is already running — a half-published Pages site is worse
  # than a queued one. Only the build of a superseded commit is wasted work.
  cancel-in-progress: false

jobs:
  # Pure CI: lint, test, build the artefact. Deliberately depends on nothing about Pages, so a
  # hosting misconfiguration can never make the code look broken. Runs on pull requests too.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test # gate the deploy on the unit + physics tests

      - run: npm run build
        env:
          # A Pages project site is served from a subpath, so every asset 404s unless `base`
          # matches the repository name exactly. Every other target — Cloudflare, Netlify, the
          # container, Azure, Capacitor — uses the '/' default. vite.config normalises this,
          # so a missing or doubled slash is harmless.
          VITE_BASE: /EarthQuakeSimulator/

      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  # Publishing. Separate from the build so its failures are unambiguous: if this job is the one
  # that is red, the problem is the Pages configuration, not the code.
  #
  # ONE-TIME SETUP, and the reason this used to fail: GitHub Pages must be enabled for the
  # repository with its source set to GitHub Actions — Settings -> Pages -> Build and
  # deployment -> Source: "GitHub Actions". Until that is done there is no Pages site to
  # publish into, and `deploy-pages` fails with a 404 "Get Pages site failed" while the build
  # above it passes. The workflow cannot do it for you: enabling Pages needs admin rights that
  # the Actions token is not granted by default.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # required for the OIDC token deploy-pages exchanges
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
