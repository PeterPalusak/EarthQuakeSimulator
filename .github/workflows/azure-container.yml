# Optional — see plan/09-container-and-azure.md. Phase 8's GitHub Pages workflow already gives
# a live, installable URL for nothing; this exists for when Azure is the mandated platform.
#
# Disabled by default: it is workflow_dispatch only, because it needs the Azure resources from
# task 9.7 and the three repository variables from 9.8 to exist first. Add
#   push: { branches: [main] }
# to the `on:` block once they do.
name: Deploy container to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC — without it azure/login fails with an opaque error

env:
  RG: rg-quake
  ACR: ${{ vars.AZURE_ACR_NAME }}
  APP: quake

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test # gate the deploy on the unit + physics tests

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # az acr build builds server-side: no local Docker daemon, and it cannot produce an
      # arm64 image that pulls fine and then crash-loops on Azure's linux/amd64 nodes.
      - run: az acr build -r $ACR -t quake:${{ github.sha }} -t quake:latest .

      # Tag with the SHA, never only `latest`: Container Apps creates a revision per image
      # change, so an immutable tag makes rollback one command. With a floating tag the
      # platform may not even notice the image changed.
      - run: |
          az containerapp update -n $APP -g $RG \
            --image $ACR.azurecr.io/quake:${{ github.sha }}

      - name: Report the live URL
        run: |
          az containerapp show -n $APP -g $RG \
            --query properties.configuration.ingress.fqdn -o tsv
